[project]
name = "goswar"
version = "0.1.0"
description = "Multi-drone swarm controller for ArduPilot SITL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.0",
    "pydantic>=2.13.4",
    "pymavlink>=2.4.49",
    "rich>=15.0.0",
    "scipy>=1.18.0",
]

[project.scripts]
swarm = "new_swarming.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/new_swarming"]




